# Release (T156).
#
# The only path that publishes to npm, and the only place `--provenance` can work:
# provenance is a signed attestation linking a tarball to the workflow run and commit that
# built it, which requires an OIDC token, which requires `id-token: write`. That is why
# `.npmrc` deliberately does *not* set `provenance=true` — there it aborts every local
# publish with `provider: null`, and `--provenance=false` is not a `pnpm publish` flag, so
# there is no way to wave it off at the call site (T034).
#
# Everything CI checks is re-run here before a single byte is uploaded. A release that can
# publish something `ci.yml` would fail is not a gate, and npm versions are immutable: the
# cost of finding out afterwards is a burned version number.
name: Release

on:
  push:
    tags: ['v*']
  # Dry runs. `publish` defaults to false, so triggering this by hand builds, tests and
  # packs without uploading — the rehearsal that a tag push does not offer.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (otherwise pack only)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # `npm publish --provenance` needs the registry configured here for the OIDC
          # exchange; without it the token has nowhere to go.
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same order as ci.yml: lint before build, because eslint must resolve the
      # workspace from source on a clean clone.
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck

      - run: pnpm test
        env:
          RULEGATE_REQUIRE_SYMLINKS: '1'

      # The lane that catches a broken `exports` map or a regressed exit code — which is
      # precisely the class of defect that only shows up once something is installed.
      - run: pnpm test
        env:
          RULEGATE_TEST_DIST: '1'

      - run: pnpm format

      # Packs every workspace package and runs init -> sync -> check from the tarballs.
      # The closest thing to the published shape that exists before publishing: `files`,
      # `exports`, and the `workspace:*` -> version rewrite.
      - run: node scripts/smoke.mjs

      - name: rulegate check (dogfood)
        run: node packages/cli/dist/bin.js check

      # The validator pins the plugin's version to the CLI's, and the step below pins the
      # CLI's to the tag, so a release cannot publish one version of the CLI while the
      # marketplace serves another of the plugin.
      - name: generated docs, bundles and plugin are current
        run: |
          node scripts/generate-docs.mjs --check
          node action/build.mjs --check
          node plugins/rulegate/build.mjs --check
          node scripts/validate-plugin.mjs

      # The tag is the version's only declaration, so a tag that disagrees with the
      # manifests would publish a version nobody asked for under a name that says
      # otherwise. Checked before publishing rather than discovered after.
      - name: tag matches the version in the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $pkg" >&2
            exit 1
          fi

      # `--no-git-checks` because a tag build is a detached HEAD, which pnpm's default
      # branch check rejects. It is load-bearing *only here*: reaching for it locally is
      # how a tarball gets cut from a tree matching no fetchable commit, which is the same
      # property provenance exists to assert (T034).
      #
      # Provenance comes from the environment, not a flag. pnpm 10 packs each package (the
      # `workspace:*` rewrite happens there) and hands the tarball to `npm publish`, and it
      # accepts `--provenance` without passing it on — 0.3.0 and 0.4.0 went out unsigned from
      # a green step (T092). npm reads NPM_CONFIG_PROVENANCE from the environment it inherits.
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # The registry, not the exit code, says whether the release happened and is signed.
      - name: every package is on npm with a provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-published.mjs "${GITHUB_REF_NAME#v}" --attestations

  # A cold install of the published version on every platform, from the registry rather than
  # from packed tarballs: the launch demo is `npx rulegate@latest init`, and smoke.mjs cannot
  # see a registry-only failure (T156).
  cold-install:
    name: npx from the registry (${{ matrix.os }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: init, then check, in an empty repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="$RUNNER_TEMP/cold"
          mkdir -p "$repo" && cd "$repo"
          git init -q
          printf '# Project\n\nUse small modules.\n' > CLAUDE.md
          npx -y "rulegate@$version" --version
          npx -y "rulegate@$version" init --yes
          npx -y "rulegate@$version" check

  # The Homebrew tap (T061). Runs only once `verify-published.mjs` has seen the version on npm,
  # signed, and pins the formula to the bytes npm actually serves — checked against npm's own
  # `dist.integrity` first — so `brew install` can never name a version npm does not have, or a
  # tarball other than the one npm signed. Pushed with a token scoped to the tap repository
  # alone; this workflow's own token cannot write anywhere but here.
  homebrew:
    name: update the Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sayansr26/homebrew-rulegate
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: formula for the tarball npm serves
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="$RUNNER_TEMP/rulegate.tgz"
          curl -fsSL "https://registry.npmjs.org/rulegate/-/rulegate-$version.tgz" -o "$tarball"
          want="$(npm view "rulegate@$version" dist.integrity)"
          got="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 | tr -d '\n')"
          if [ "$want" != "$got" ]; then
            echo "downloaded tarball does not match npm's integrity: $got != $want" >&2
            exit 1
          fi
          sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          node scripts/stage-homebrew-tap.mjs tap "$version" "$sha"

      - name: push the formula
        working-directory: tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "the tap already installs ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git commit -q -m "rulegate ${GITHUB_REF_NAME#v}"
          git push

  # `brew install` on a clean macOS runner, from the tap as a user reaches it: T061's validation,
  # repeated on every release rather than once by hand.
  brew-install:
    name: brew install from the tap
    needs: homebrew
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: install, audit and test
        run: |
          brew install sayansr26/rulegate/rulegate
          brew audit --formula sayansr26/rulegate/rulegate
          brew test sayansr26/rulegate/rulegate
          test "$(rulegate --version)" = "${GITHUB_REF_NAME#v}"
