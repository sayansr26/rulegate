# Rulegate's own canonical config. This repository dogfoods itself: AGENTS.md, CLAUDE.md,
# GEMINI.md, .cursor/rules/*.mdc and .github/copilot-instructions.md are generated from the
# rules below, and are not edited by hand. Change a rule here, run `rulegate sync`, commit
# the rule and every regenerated file together.
schemaVersion: 1
tools:
  - aider
  - claude-code
  - cline
  - codex
  - copilot
  - cursor
  - roo-code
  - windsurf
  - zed
  - gemini

options:
  # `fixtures/` holds instruction files as *test data* — every golden CLAUDE.md, AGENTS.md
  # and GEMINI.md under it is input to a byte-exact comparison, not a rule any tool loads —
  # so the doctor orphan scan would otherwise report ~30 of them. Since T062 this also
  # keeps nested discovery out: the fixtures contain whole `.rulegate/` trees, including
  # deliberately malformed ones, and treating them as canonical levels would have `sync`
  # generating artifacts into its own test data and `check` failing on a broken fixture.
  ignore:
    - fixtures/**
