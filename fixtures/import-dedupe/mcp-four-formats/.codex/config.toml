[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp"

[mcp_servers.github.env_http_headers]
Authorization = "GITHUB_TOKEN"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.postgres]
command = "uvx"
args = ["mcp-server-postgres"]
env_vars = ["PGPASSWORD"]
